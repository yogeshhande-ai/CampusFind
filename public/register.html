<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - CampusFind</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==========================================
         NAVIGATION
         ========================================== -->

    <nav class="navbar">

        <div class="logo">
            CampusFind
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>



    <!-- ==========================================
         REGISTER PAGE
         ========================================== -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">

                Join CampusFind to manage
                your lost and found reports.

            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >



                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >



                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <small>
                    Password must be at least 6 characters.
                </small>



                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>


            </form>



            <!-- LOGIN LINK -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </main>



    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer>

        <p>
            © 2026 CampusFind -
            Campus Lost & Found Portal
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
